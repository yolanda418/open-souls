name: 续写

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      ticks:
        description: '续写几回'
        required: true
        default: '1'
      pressure:
        description: '压力'
        required: true
        default: '0.2'
  push:
    branches: [main]

concurrency: village-tick

jobs:
  tick:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip install pyyaml
        run: pip install pyyaml

      - name: 运行续写引擎
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python engine/village.py --ticks ${{ github.event.inputs.ticks || 1 }} --pressure ${{ github.event.inputs.pressure || 0.2 }}

      - name: 文笔上线门
        run: python engine/prose_lint.py

      - name: 提交更改
        run: |
          git config user.name "村子史官"
          git config user.email "chronicler@village.local"
          git add .
          git commit -m "自动续写一次" || echo "No changes to commit"
          git push
