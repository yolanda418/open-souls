rating: 悬疑      # 调整为你的核心题材：都市、硬核悬疑、反转
cadence: "0 */6 * * *"  # 自动化续写的时间频率（可根据需要调整）
target_chapter_chars: 3000  # 按照你的最新要求，单章目标字数提升至 3000 字
chapters_per_beat: 3    # 每个剧情节拍的章节数
default_pressure: 0.5   # 日常张力（悬疑小说需要更高的压迫感和节奏感，建议设为 0.5 左右）
newcomer_priority: true # 新登场角色优先推进剧情

model_tiers:
  light: claude-haiku-4-5
  heavy: claude-sonnet-4-6
  peak: claude-opus-4-8

delegation:
  max_concurrent_children: 12  # 并行处理子任务的数量
